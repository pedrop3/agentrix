services:
  neo4j:
    image: neo4j:5-community
    container_name: agentrix-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (UI web)
      - "7687:7687"   # Bolt (driver Python)
    environment:
      # Credenciais default — sobrescreva em .env se quiser
      NEO4J_AUTH: "neo4j/agentrix-dev-pwd"
      # APOC é opcional, mas ajuda em queries de grafo (path expansion etc.)
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
